name: Feature request
description: Suggest an idea for ASKII
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like ASKII to do?
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
