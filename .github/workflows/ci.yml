name: CI

on:
  push:
    branches: [main, v2]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Check manifest versions match
        shell: pwsh
        run: |
          $pkg = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tauri = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $cargo = ((Get-Content src-tauri/Cargo.toml) | Where-Object { $_ -match '^version\s*=\s*"([^"]+)"' } | Select-Object -First 1) -replace '^version\s*=\s*"([^"]+)".*$', '$1'
          Write-Host "package.json=$pkg tauri.conf.json=$tauri Cargo.toml=$cargo"
          if ($pkg -ne $tauri -or $pkg -ne $cargo) {
            Write-Error "Version mismatch across manifests"
            exit 1
          }

      - name: Install frontend dependencies
        run: npm ci

      - name: Frontend unit tests (Vitest)
        run: npm test

      - name: Frontend production build
        run: npm run build

      - name: Rust unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
