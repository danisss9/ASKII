name: Release

on:
  push:
    tags:
      - 'askii_*'

permissions:
  contents: write # create GitHub releases and upload assets
  id-token: write # OIDC token for npm trusted publishing + provenance

jobs:
  # Same gates as every push/PR: type-check, lint, unit + integration tests,
  # CLI build and VSIX size budget. Nothing is published unless they pass.
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#askii_}" >> $GITHUB_OUTPUT

      - name: Check tag matches package versions
        run: node scripts/check-versions.js "${GITHUB_REF_NAME}"

      # ── VS Code extension ─────────────────────────────────────────────────

      - name: Install extension dependencies
        run: npm ci

      - name: Package VS Code extension
        run: npx @vscode/vsce package --no-dependencies -o askii-${{ steps.version.outputs.VERSION }}.vsix

      # ── CLI ───────────────────────────────────────────────────────────────

      - name: Install CLI dependencies
        working-directory: ./cli
        run: npm ci

      - name: Build CLI (production)
        working-directory: ./cli
        run: npm run build:prod

      # ── GitHub Release ────────────────────────────────────────────────────

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ASKII ${{ steps.version.outputs.VERSION }}
          files: askii-${{ steps.version.outputs.VERSION }}.vsix
          generate_release_notes: true

      # ── npm (askii-cli) ───────────────────────────────────────────────────

      # Uses npm Trusted Publishing (OIDC) — no NPM_TOKEN needed. Configure the
      # trusted publisher on npmjs.com: askii-cli → Settings → Trusted Publisher
      # (GitHub Actions, repo danisss9/ASKII, workflow release.yml).
      # Provenance attestations are generated automatically.

      - name: Update npm (trusted publishing requires npm >= 11.5.1)
        run: npm install -g npm@11

      # Every publish step skips a version that is already out, so a failed
      # release can simply be re-run without failing on the steps that worked.
      - name: Publish CLI to npm
        working-directory: ./cli
        run: |
          if npm view "askii-cli@${{ steps.version.outputs.VERSION }}" version > /dev/null 2>&1; then
            echo "askii-cli@${{ steps.version.outputs.VERSION }} is already published — skipping"
          else
            npm publish --access public
          fi

      # ── VS Code Marketplace ───────────────────────────────────────────────
      # Requires a MARKETPLACE_PAT secret: a Personal Access Token from
      # https://dev.azure.com with the "Marketplace (Publish)" scope.

      - name: Publish VS Code extension
        run: npx @vscode/vsce publish --skip-duplicate --packagePath askii-${{ steps.version.outputs.VERSION }}.vsix --pat ${{ secrets.MARKETPLACE_PAT }}

      # ── Open VSX (open-vsx.org) ───────────────────────────────────────────
      # Requires an OPEN_VSX_PAT secret: log in at https://open-vsx.org with
      # the GitHub account that owns the namespace (danisss9) and create an
      # access token under User Settings → Access Tokens.

      - name: Publish VS Code extension to Open VSX
        run: npx ovsx publish --skip-duplicate askii-${{ steps.version.outputs.VERSION }}.vsix --pat ${{ secrets.OPEN_VSX_PAT }}
