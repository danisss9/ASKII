name: Release

on:
  push:
    tags:
      - 'askii_*'

permissions:
  contents: write # create GitHub releases and upload assets
  id-token: write # npm provenance attestation

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#askii_}" >> $GITHUB_OUTPUT

      # ── VS Code extension ─────────────────────────────────────────────────

      - name: Install extension dependencies
        run: npm ci

      - name: Package VS Code extension
        run: npx @vscode/vsce package --no-dependencies -o askii-${{ steps.version.outputs.VERSION }}.vsix

      # ── CLI ───────────────────────────────────────────────────────────────

      - name: Install CLI dependencies
        working-directory: ./cli
        run: npm ci

      - name: Build CLI (production)
        working-directory: ./cli
        run: npm run build:prod

      # ── GitHub Release ────────────────────────────────────────────────────

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ASKII ${{ steps.version.outputs.VERSION }}
          files: askii-${{ steps.version.outputs.VERSION }}.vsix
          generate_release_notes: true

      # ── npm (askii-cli) ───────────────────────────────────────────────────

      - name: Publish CLI to npm
        working-directory: ./cli
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # ── VS Code Marketplace ───────────────────────────────────────────────
      # Requires a MARKETPLACE_PAT secret: a Personal Access Token from
      # https://dev.azure.com with the "Marketplace (Publish)" scope.

      - name: Publish VS Code extension
        run: npx @vscode/vsce publish --packagePath askii-${{ steps.version.outputs.VERSION }}.vsix --pat ${{ secrets.MARKETPLACE_PAT }}

  # ── Android APK ────────────────────────────────────────────────────────────
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#askii_}" >> $GITHUB_OUTPUT

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'

      - name: Install app dependencies
        working-directory: ./app
        run: npm ci

      - name: Build Ionic web app
        working-directory: ./app
        run: npm run build:prod

      - name: Sync Capacitor Android
        working-directory: ./app
        run: npx cap sync android

      - name: Build release APK (signed if keystore is configured)
        working-directory: ./app/android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > askii-release.keystore
            cat >> app/build.gradle <<'EOF'
            android.signingConfigs {
              release {
                storeFile file('../../askii-release.keystore')
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS')
                keyPassword System.getenv('KEY_PASSWORD')
              }
            }
            android.buildTypes.release.signingConfig = android.signingConfigs.release
          EOF
            ./gradlew assembleRelease
            cp app/build/outputs/apk/release/app-release.apk ../../askii-${{ steps.version.outputs.VERSION }}.apk
          else
            ./gradlew assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk ../../askii-${{ steps.version.outputs.VERSION }}.apk
          fi

      - name: Upload APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: askii-${{ steps.version.outputs.VERSION }}.apk
