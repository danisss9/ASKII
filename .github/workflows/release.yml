name: Release

on:
  push:
    tags:
      - 'askii_*'

permissions:
  contents: write

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Verify tag matches manifest versions
        id: version
        shell: pwsh
        run: |
          $tagVer = "${{ github.ref_name }}" -replace '^askii_', ''
          $pkg = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tauri = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $cargo = ((Get-Content src-tauri/Cargo.toml) | Where-Object { $_ -match '^version\s*=\s*"([^"]+)"' } | Select-Object -First 1) -replace '^version\s*=\s*"([^"]+)".*$', '$1'
          if ($tagVer -ne $pkg -or $tagVer -ne $tauri -or $tagVer -ne $cargo) {
            Write-Error "Tag ($tagVer) does not match manifest versions (package=$pkg, tauri=$tauri, cargo=$cargo)"
            exit 1
          }
          "VERSION=$tagVer" >> $env:GITHUB_OUTPUT

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Windows installer (Tauri)
        run: npm run tauri:build

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ASKII ${{ steps.version.outputs.VERSION }}
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
          generate_release_notes: true
